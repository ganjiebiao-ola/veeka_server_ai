# nginx config for the Ola Security Agent frontend container.
# Serves the Vite production bundle and proxies /api/* to the backend service.

server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Hashed Vite bundles are content-addressed (filename changes when content
  # changes), so they're safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback — every unknown path resolves to index.html. Never cache the
  # shell so a new deploy is picked up without a hard refresh (the hashed
  # bundle names above do the real cache-busting).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # ----- /api/* → backend (Hono on :37018) ---------------------------------
  # SSE stream (/api/runs/<id>/events) requires:
  #   • HTTP/1.1 with explicit "Connection:" (kept empty for keep-alive)
  #   • proxy_buffering off so chunks reach the browser immediately
  #   • long read timeout so the connection isn't reaped mid-run
  location /api/ {
    proxy_pass         http://backend:37018;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # SSE-specific
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;

    # Allow large spec/zip uploads (POST /api/runs).
    client_max_body_size 64m;
  }
}
