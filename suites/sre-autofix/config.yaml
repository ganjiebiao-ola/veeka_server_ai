# suites/sre-autofix/config.yaml — TEMPLATE. Do not edit this file in place: copy it to
# suites/sre-autofix/config.local.yaml (gitignored) and fill that — it takes precedence whenever it
# exists, and `git pull` will never conflict with your edits. `run doctor` shows which file is in effect.
# Parsed by lib/config.py (hand-walked YAML subset: scalars, inline [a, b] lists, nested maps,
# lists of maps; no anchors, no block scalars). Fill the TODO(owner) slots per team; entries whose
# id still contains TODO are ignored by `run claim` and rejected only when a verb needs them.
version: 1

# eligibility predicate 1 floor: low | medium | high (upstream default medium — the golden case was medium)
min_confidence: medium

# handoff scaffold — stays in the worktree, never enters a commit; contract, do not edit
scaffold: [INCIDENT.md, FIXNOTES.md, .sre-evidence/]

# wall clock per `repos[].checks` command (seconds); a command that overruns fails the gate (exit 124)
checks_wall_sec: 600

# One entry per mounted repo this suite may target. id = workspace.yaml repositories[].id.
# Repos not listed here are never fix targets.
repos:
  - id: "TODO(owner): <mounted-repo-id>"
    scope: ["TODO(owner): app/"]           # allowed path prefixes ("dir/"); empty ⇒ every patch fails the gate
    base: main                             # TODO(owner): base branch for the worktree and the PR
    remote: origin                         # git remote name inside repos/<id> (fetch + push)
    github: "TODO(owner): <owner>/<repo>"  # for `gh pr create --repo`; if left TODO, derived from `git remote get-url`
    # Gate check 5 — the repo's OWN compile / static / lint commands, run by `run gate` inside the
    # worktree with `sh -c`; every one must exit 0. The suite has no language knowledge: you say what
    # "correct" means for this repo. Commands run with cwd = the WORKTREE. Placeholders: {files} = changed
    # files (shell-quoted, relative to the worktree), {worktree} = its absolute path, {root} = this
    # workspace's absolute path (use it for anything that lives here, e.g. docs/examples/*.sh). Empty ⇒ the row reads 『未配置』 and passes, i.e.
    # only the agent's self-declared verification stands (that is how the first drill shipped a PHP
    # patch that died at runtime). Don't know what to put here? Leave it empty and run
    # `suites/sre-autofix/run doctor`: it reads this repo's CI workflow and toolchain markers and prints
    # a paste-ready line, flagging when the suggestion is syntax-only. Warns when a binary is off PATH.
    #   Go:   checks: ["go build ./...", "go vet ./..."]
    #   PHP:  checks: ["php -l {files}"]          # syntax only — misses by-ref / type errors. Add a
    #                                             # static analyser: with composer autoload + a baseline,
    #         checks: ["php -l {files}", "vendor/bin/phpstan analyse --level 5 {files}"]
    #                                             # without either (legacy repo), report NEW errors only:
    #         checks: ["sh {root}/suites/sre-autofix/docs/examples/phpstan-new-errors.sh {worktree} {files}"]
    #                                             # (docker; PHPSTAN_STUBS=<framework ide-stubs>; ~10-30 s)
    #   Node: checks: ["npm run -s lint", "npx tsc --noEmit"]
    #   Any:  reuse what the repo's CI runs (e.g. its scripts/lint), so the gate and the PR agree.
    checks: []

# `run fix --headless`: the operator's own agent CLI runs the fix in the worktree
# Interactive use (the default) needs none of this: the agent session you already work in reads
# the worktree's INCIDENT.md. `run doctor` shows which CLIs are on PATH.
#
# Built-in executors (pick with `agent`; argv is assembled by lib/headless.py, cwd = the worktree):
#   claude   → claude -p <prompt> --output-format stream-json --permission-mode acceptEdits
#              --allowedTools Read Edit Write … + read-only Bash patterns --disallowedTools git commit/push/… gh …
#              --max-budget-usd <max_budget_usd> [--model <model>]
#   codex    → codex exec --cd <worktree> --sandbox workspace-write --json -o <response> [-m <model>] <prompt>
#   opencode → opencode run [-m <model>] <prompt>
headless:
  agent: auto            # auto | claude | codex | opencode  (auto = first found on PATH, in that order)
  model: ""              # empty ⇒ the CLI's default
  max_budget_usd: 5      # claude --max-budget-usd (ignored by the other executors)
  wall_sec: 3600         # wall clock per attempt (upstream timeoutSeconds)
  retries: 1             # retries after a failed gate (upstream -fix-retries)
  command: []            # escape hatch for a CLI that is NOT built in, or to override a built-in argv.
                         # Explicit argv with {prompt} {worktree} {response} placeholders; runs with cwd = worktree;
                         # the suite only reads the worktree afterwards. Examples:
                         #   [aider, --yes, --message, "{prompt}"]
                         #   [claude, -p, "{prompt}", --permission-mode, acceptEdits, --model, opus]   # custom claude flags
