# team-context/manifest.d/00-template.yaml — framework-owned Context Manifest rows (shipped by the template).
# Rendered together with 50-team.yaml into team-context/manifest.yaml by scripts/render-context-manifest.
# Do not edit in a team workspace (platform-internals/ownership.yaml: framework) — add team rows to 50-team.yaml.
# Row shape and the three red lines: agent-instructions/context-manifest.md.
version: 1

task_types:
  # Baseline every task reads (the always-on set, made explicit).
  default:
    read:
      - { path: agent-instructions/security-defaults.md, authority: trusted, last_reviewed: 2026-09-03 }
      - { path: team-context/security-defaults.team.md,  authority: trusted, last_reviewed: 2026-09-03 }
      - { path: rules/team-rules.md,               authority: trusted, last_reviewed: 2026-07-24 }

  # Mounting something, or deciding whether it belongs in a mount point at all (#93).
  mounting:
    when: "task clones into repos/ | skills/ | knowledge/, or asks where an asset belongs"
    read:
      - { path: agent-instructions/mount-points.md, authority: trusted, last_reviewed: 2026-08-04 }
      - { path: workspace.yaml,               authority: trusted, last_reviewed: 2026-08-04 }

  # Working inside a mounted business repo. Template rows: <id> = the repo's id in workspace.yaml.
  mounted-repo-work:
    when: "task touches repos/<id>"
    read:
      - { path: team-context/mounted-repos/<id>.md, authority: trusted, last_reviewed: 2026-07-24 }
      - { path: knowledge/maps/<id>/,  authority: data,    last_reviewed: 2026-07-24 }

  # Structural code questions answered from the code map (agent-instructions/code-map.md).
  structural-code:
    when: "task asks about symbols, callers, call chains, or cross-repo impact"
    read:
      - { path: agent-instructions/code-map.md, authority: trusted, last_reviewed: 2026-10-13 }
      - { path: knowledge/maps/overview.md, authority: data, last_reviewed: 2026-10-13, optional: true }
      - { path: team-context/mounted-repos/<id>.md, authority: trusted, last_reviewed: 2026-10-13 }
      - { path: skills/code-map-query/SKILL.md, authority: data, last_reviewed: 2026-10-13 }

  repo-orientation:
    when: "task asks for an overview of an unfamiliar mounted repo"
    read:
      - { path: knowledge/maps/overview.md, authority: data, last_reviewed: 2026-10-13, optional: true }
      - { path: team-context/mounted-repos/<id>.md, authority: trusted, last_reviewed: 2026-10-13 }
      # then call get_architecture on the live graph (architecture.md had 0 reads in two report periods)

  # Creating / moving / auditing a reusable asset (#48).
  asset-authoring:
    read:
      - { path: agent-instructions/asset-metadata.md,     authority: trusted, last_reviewed: 2026-07-24 }
      - { path: platform-internals/schemas/asset-metadata.schema.json, authority: trusted, last_reviewed: 2026-07-24 }

  # Drafting a four-part project Spec with the spec-authoring skill (#31, S1-S4).
  spec-authoring:
    when: "task drafts or completes a four-part feature/project Spec"
    read:
      - { path: skills/spec-authoring/SKILL.md, authority: data, last_reviewed: 2026-08-18 }
      - { path: skills/spec-authoring/references/coverage-map.md, authority: data, last_reviewed: 2026-08-18 }
      - { path: skills/spec-authoring/references/gap-rules.md, authority: data, last_reviewed: 2026-08-18 }
      - { path: skills/spec-authoring/references/qa-loop.md, authority: data, last_reviewed: 2026-08-18 }
      - { path: skills/spec-authoring/references/downstream-contract.md, authority: data, last_reviewed: 2026-08-18 }

  # Analyzing the operator's local token usage with the token-usage-analysis skill (#32, S1/T1).
  token-usage:
    when: "task analyzes the operator's local AI-coding token consumption"
    read:
      - { path: skills/token-usage-analysis/SKILL.md, authority: data, last_reviewed: 2026-08-19 }
      - { path: skills/token-usage-analysis/references/metrics-guide.md, authority: data, last_reviewed: 2026-08-20 }
      - { path: skills/token-usage-analysis/references/tool-selection-adr.md, authority: data, last_reviewed: 2026-08-20 }

  # Running or authoring a vertical suite (#43). Template row: <id> = the suite id.
  suite-run:
    read:
      - { path: suites/<id>/SUITE.md, authority: trusted, last_reviewed: 2026-07-24 }
      - { path: suites/sre-autofix/SUITE.md, authority: trusted, last_reviewed: 2026-08-25 }

  # Turning an upstream SRE root-cause report into a fix PR with suites/sre-autofix (#141).
  incident-fix:
    when: "task fixes code from an SRE report.json / 修复这份 SRE 报告 / autofix"
    read:
      - { path: suites/sre-autofix/SUITE.md,               authority: trusted, last_reviewed: 2026-08-25 }
      - { path: suites/sre-autofix/docs/input-contract.md, authority: trusted, last_reviewed: 2026-08-25 }
      - { path: suites/sre-autofix/docs/runbook.md,        authority: trusted, last_reviewed: 2026-08-25 }

  # Verifying / root-causing a production alert locally with suites/sre-inspect (#146).
  sre-inspect:
    when: "task investigates a Grafana alert / 排查告警 / 深挖 / 巡检, or produces a report.json for sre-autofix"
    read:
      - { path: suites/sre-inspect/SUITE.md,               authority: trusted, last_reviewed: 2026-08-28 }
      - { path: suites/sre-inspect/docs/quickstart.md,     authority: trusted, last_reviewed: 2026-08-28 }
      - { path: suites/sre-inspect/docs/dive-contract.md,  authority: trusted, last_reviewed: 2026-08-28 }
      - { path: skills/grafana-sls/SKILL.md,               authority: trusted, last_reviewed: 2026-08-28 }

  # Reading or steering the security patch flow with suites/security-patch (#9).
  security-patch:
    when: "task asks about security findings, the bug-type issues, batch security PRs / 安全补丁 / resume a security run"
    read:
      - { path: suites/security-patch/SUITE.md,           authority: trusted, last_reviewed: 2026-10-26 }
      - { path: suites/security-patch/docs/quickstart.md, authority: trusted, last_reviewed: 2026-10-26 }
      - { path: skills/security-patch/SKILL.md,           authority: trusted, last_reviewed: 2026-10-26 }
      - { path: suites/security-patch/docs/runbook.md,    authority: trusted, last_reviewed: 2026-10-26 }

  # Syncing a team workspace with the upstream template (skills/workspace-upstream-sync).
  upstream-sync:
    when: "task syncs this workspace with the upstream template / 跟上游同步 / sync with the template / 反哺模板"
    read:
      - { path: skills/workspace-upstream-sync/SKILL.md, authority: data,    last_reviewed: 2026-09-03 }
      - { path: platform-internals/ownership.yaml,        authority: trusted, last_reviewed: 2026-09-03 }

  # Pulling teammates' merged PRs into this workspace clone (skills/workspace-update).
  workspace-update:
    when: "task updates this workspace clone from origin / 更新 workspace / update my workspace / what changed in the workspace"
    read:
      - { path: skills/workspace-update/SKILL.md,        authority: data,    last_reviewed: 2026-11-02 }

  # Replaying or studying a golden sample pack (#44): structured requirement -> acceptance.
  # Only paths that exist in a plain clone are listed — the pack's gitignored .mount/ appears inside
  # its own directory after `ws golden` materializes it (repos/ stays reserved for real business
  # mounts). Its per-repo context is team-context/mounted-repos/campaign-validator.md below — the
  # worked example of the <id>.md shape.
  golden-replay:
    when: "task runs or studies platform-internals/golden/<pack-id>/"
    read:
      - { path: platform-internals/golden-sample-pack.md, authority: trusted, last_reviewed: 2026-07-29 }
      - { path: platform-internals/golden/campaign-validator/PACK.md,  authority: trusted, last_reviewed: 2026-07-29 }
      - { path: platform-internals/golden/campaign-validator/requirement/REQ-001-campaign-config-validation.md, authority: trusted, last_reviewed: 2026-07-29 }
      - { path: team-context/mounted-repos/campaign-validator.md, authority: trusted, last_reviewed: 2026-07-29 }

  # Writing or reviewing the workspace root entry (CLAUDE.md / AGENTS.md) or a per-repo context file.
  agent-entry-authoring:
    read:
      - { path: agent-instructions/claude-md-hierarchy.md, authority: trusted, last_reviewed: 2026-08-05 }

  # Authoring or auditing the read-order list or a governed context doc (#49).
  context-governance:
    read:
      - { path: agent-instructions/context-manifest.md, authority: trusted, last_reviewed: 2026-08-05 }

  # Handing the workspace to the receiving team (#50).
  handoff:
    read:
      - { path: agent-instructions/handoff-checklist.md, authority: trusted, last_reviewed: 2026-08-05 }
