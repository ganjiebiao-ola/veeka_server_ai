name: Secret scan

# ws health runs this scan only on an operator's machine. A credential-shaped literal that reaches
# main fails ws health for every workspace that syncs it, so check every PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the scanner tests
        run: python3 -m unittest platform-internals/tests/test_secret_scan.py
      - name: Scan tracked files
        run: python3 scripts/check-secret-scan
