name: Security patch

# Runs only when the suite, its operator skill, workspace.yaml (the portability check reads it)
# or this file changes.
on:
  pull_request:
    paths:
      - suites/security-patch/**
      - skills/security-patch/**
      - workspace.yaml
      - .github/workflows/security-patch.yml
  push:
    branches: [main]
    paths:
      - suites/security-patch/**
      - skills/security-patch/**
      - workspace.yaml
      - .github/workflows/security-patch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-patch:
    name: Security patch validation (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [scanner, backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: |
          bun install --cwd suites/security-patch/app --frozen-lockfile --ignore-scripts
          bun install --cwd suites/security-patch/app/backend --frozen-lockfile --ignore-scripts
          bun install --cwd suites/security-patch/app/frontend --frozen-lockfile --ignore-scripts
      # The scanner image and its Docker sandbox test run in security-patch-sandbox.yml.
      - name: Run full validation
        env:
          SKIP_SCANNER_IMAGE: "1"
        run: suites/security-patch/test --app=${{ matrix.part }}
